/* Bluetooth SPP diagnostics. Watch expressions only: no writes, reset, run,
 * flash access, or key material. Existing user watch expressions are preserved.
 * Load once from the debugger Command window: INCLUDE .\watch.ini
 * Or select .\watch.ini as Options for Target > Debug > Initialization File.
 * Watch 1: HCI/security/bonds. Watch 2: protocols/transport/event history.
 * Expand BT_SPP_Debug and BT_SPP_Trace. Latest trace slot is
 * (BT_SPP_TraceNext + 31) % 32. Counts survive ordinary ACL disconnects.
 */
WK 1
WS 1, BT_InitState
WS 1, BT_ScanState
WS 1, BT_SSPState
WS 1, BT_HCI_CmdState
WS 1, BT_HCI_CmdOpcode
WS 1, BT_HCI_DebugFailStage
